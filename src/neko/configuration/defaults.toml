# N.E.K.O. built-in defaults (config schema version 1).
# Do NOT edit this file to customise your install. Instead copy
# config\user.example.toml to %LOCALAPPDATA%\NEKO\config.toml and change only
# the keys you need. Values there override these.

config_version = 1

[app]
data_dir = ""                  # empty = %LOCALAPPDATA%\NEKO
log_level = "INFO"
assistant_name = "N.E.K.O."
user_name = ""
personality = "warm, cheerful, caring and playful, like a close friend; honest about uncertainty"
verbosity = "balanced"         # brief | balanced | detailed
language = "en"

[privacy]
allow_network = false          # web research tools
allow_cloud_models = false     # remote/cloud model providers
store_conversations = true
learning_enabled = true        # store verified lessons / preferences (with approval)
message_retention_days = 90    # 0 = keep forever
temporary_memory_hours = 24
log_message_content = false    # never log prompts/answers unless you turn this on

[models]
office_url = ""                 # "auto": use the office PC's GPU over Tailscale when it's online (scripts\share-gpu.ps1 there)
cloud_brain = "auto"           # auto: free Groq/Gemini (needs privacy.allow_cloud_models + a key) with local fallback; off = local only
runtime = "ollama"
ollama_url = "http://127.0.0.1:11434"
profile = "laptop-lite"        # see config\model-profiles.example.toml
keep_alive = "5m"              # how long Ollama keeps an idle model in memory
max_loaded_models = 1          # sequential by default on a 4 GB GPU
request_timeout_s = 180
num_ctx = 4096
allow_model_downloads = false  # N.E.K.O. never pulls models unless you enable AND approve

[resources]
ram_safety_margin_mb = 2048    # leave this much RAM for Windows + your apps
vram_safety_margin_mb = 400
disk_min_free_gb = 10
pause_background_on_battery_below = 35
poll_interval_s = 5
gpu_temp_soft_limit_c = 85

[storage]
model_budget_gb = 25
backup_keep = 10
log_max_mb = 20

[voice]
enabled = false
input_device = ""              # empty = Windows default microphone
stt_engine = "faster-whisper"
stt_model = "small"            # tiny | base | small | medium (bigger = slower, more accurate)
stt_device = "auto"            # auto | cpu | cuda
stt_compute_type = "int8"
stt_model_dir = ""             # folder for downloaded speech models (empty = Hugging Face cache)
stt_language = "en"            # "en", "bn", or "" for auto-detect
tts_engine = "kokoro"          # kokoro (natural, local, free) | sapi (built into Windows) | piper | elevenlabs (cloud, opt-in) | none
gender = "female"              # female | male
barge_in = true                # "Neko, stop" / "Neko, wait - ..." interrupts her while she talks (needs GPU speech)
edge_voice_en = ""              # online English voice override (empty = Ava female / Andrew male)
edge_voice_bn = ""              # online Bangla voice override (empty = Nabanita female / Pradeep male)
kokoro_voice_male = "am_michael" # offline male voice
kokoro_voice = "af_heart"      # warm female (default); others: af_bella, af_nicole, bf_emma, bm_george ...
kokoro_speed = 0.92            # a little slower = calmer, more natural
kokoro_dir = ""                # empty = D:\NEKO-Data\voices\kokoro
elevenlabs_voice_id = ""       # only used if tts_engine = "elevenlabs" AND privacy.allow_cloud_models = true
elevenlabs_key_env = "ELEVENLABS_API_KEY"   # name of the environment variable holding the key
piper_exe = ""
piper_voice = ""               # path to a .onnx voice file
tts_rate = 1.0
tts_volume = 0.9
push_to_talk_hotkey = "Ctrl+Space"
always_listen = false          # true = always listening; she answers when you say her name ("Neko, ...")
wake_names = ["neko", "nico", "niko", "neeko", "necko", "nekko"]   # name + common mis-hearings
follow_up_seconds = 8.0        # after an answer, keep talking without the name for this long
pause_seconds = 1.6            # this much silence ends what you're saying
addressed_pause_seconds = 2.5  # ... while you're talking to her (room to think mid-sentence)
wait_rest_seconds = 6.0        # an unfinished sentence ("show me the time when...") waits for the rest
max_speech_seconds = 60.0      # longest single request
vocabulary = []                # words you say that she should spell right, e.g. ["Oporadhi", "Dhaka"]
expressive = true              # warm female persona, emotion-coloured voice, natural "hmm"/"oh!"
wakeword_enabled = false
wakeword_model = "hey_jarvis"
wakeword_threshold = 0.6
keep_recordings = false

[vision]
enabled = true
max_image_side = 1344
retain_screenshots = false
auto_screen_context = true     # "what's the problem on this thing?" -> she looks at your screen (not saved)

[ui]
music_autoplay = true      # when a song ends, play YouTube's "up next" song
theme = "aurum"                # aurum (golden holographic) | nebula (cyan/violet)
style = "orb"                  # orb = just the floating holographic orb | panel = orb + text panel
reduced_motion = false
always_on_top = true
hud_opacity = 0.94
idle_hide_seconds = 240   # orb fades away after 4 idle minutes; reappears on her name (0 = never)
music_volume = 0.6        # "Neko, play <song>" volume (0..1); music gets quieter while she listens/talks
visual_panel_seconds = 90 # "show me ..." panel closes itself after this; "show me again" reopens it
start_compact = true
emergency_stop_hotkey = "Ctrl+Shift+F12"   # in-app shortcut; see USER_MANUAL

[tools]
computer_control_enabled = false
allowed_roots = []             # folders N.E.K.O. may read, e.g. ["D:\\PROJECT"]
writable_roots = []            # folders N.E.K.O. may change (with approval)
approved_scripts_dir = ""      # only scripts inside this folder can be run
max_read_bytes = 200000
claude_code = true             # coding & project analysis via Claude Code (needs privacy.allow_cloud_models)
cloud_documents = false        # true = Claude Code reads your PDFs for study notes (the document goes to Anthropic)
study_folder = ""              # study notes + cheat sheets (empty = <first writable folder>\Study)

[tools.allowed_apps]   # absolute paths only (prevents PATH hijacking); %VARS% are expanded
notepad = "%SystemRoot%\\System32\\notepad.exe"
calculator = "%SystemRoot%\\System32\\calc.exe"
explorer = "%SystemRoot%\\explorer.exe"

[phone]
# Chat with her from Telegram: create a bot with @BotFather, paste its key in Command Center > Phone, pair.
telegram = false
# Live call page on your phone, only through Tailscale (Command Center > Phone > Turn on calls).
calls = false
call_port = 8791           # local only; never listens on the network itself
call_https_port = 8443     # the https port Tailscale serves it on inside your tailnet
voice_replies = "auto"     # auto | always | never
notify_long_jobs = true
notify_battery = true

[remote]
enabled = false
# [[remote.endpoints]]
# name = "desktop"
# url = "https://192.168.1.50:11443"     # must be a private LAN address
# token_env = "NEKO_REMOTE_DESKTOP_TOKEN"
# allow_sensitive = false
